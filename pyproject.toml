[build-system]
requires = ["flit_core >=3.2,<4"]
build-backend = "flit_core.buildapi"

[project]
name = "sector_study"
version = "0.0.1"
description = "Analysis of relationship between index fund sectors and financial news coverage."
authors = [
  { name = "Christian Johnson" },
]

readme = "README.md"
classifiers = [
    "Programming Language :: Python :: 3",
    
]
requires-python = "~=3.13.0"


[tool.ruff]
line-length = 80
src = ["sector_study"]
include = ["pyproject.toml", "sector_study/**/*.py"]

[tool.ruff.lint]
extend-select = ["I"]  # Add import sorting

[tool.ruff.lint.isort]
known-first-party = ["sector_study"]
force-sort-within-sections = true

